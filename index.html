<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BÁO CÁO HỦY & MCH Win Rural by HaoDT v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f4;--surface:#fff;--line:#d9dfdd;--ink:#17221f;--muted:#5d6b67;--red:#b91c1c;--orange:#b45309;--green:#15803d;--teal:#0f5f57;--red-soft:#fbe6e6;--orange-soft:#fbf0dd;--green-soft:#e5f4ea;--teal-soft:#e2f0ee;--accent:#c2410c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:12.5px/1.45 "Be Vietnam Pro",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:100%;margin:0 auto;padding:8px 12px 24px;display:grid;gap:6px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px}
.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#d71920;color:#fff;font:800 16px/1 "Be Vietnam Pro",system-ui,sans-serif}
.brand h1{margin:0;font:700 15px/1.1 "Be Vietnam Pro",system-ui,sans-serif}
.tag{background:#d71920;color:#fff;font:600 9px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:3px}
.tag.sub{background:var(--teal);margin-left:3px}
.fileinfo{color:var(--muted);font-size:10.5px}
.btn{font:600 11px "Be Vietnam Pro",system-ui,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 9px;border-radius:5px;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.drop{border:2px dashed var(--line);border-radius:10px;background:var(--surface);padding:20px;text-align:center;display:grid;gap:6px;justify-items:center;cursor:pointer}
.drop:hover{border-color:var(--teal);background:var(--teal-soft)}
.drop h2{margin:0;font:700 15px "Be Vietnam Pro",system-ui,sans-serif}
.drop p{margin:0;color:var(--muted);font-size:12px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:6px 10px;display:grid;gap:1px}
.kpi .lbl{font:600 8.5px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 16px/1.2 "Be Vietnam Pro",system-ui,sans-serif}
.kpi .s{font-size:10px;color:var(--muted)}
.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--orange)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font:600 11px "Be Vietnam Pro",system-ui,sans-serif;border:0;background:none;color:var(--muted);padding:5px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}

.filters{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:end}
.f{display:grid;gap:1px}
.f label{font:600 9px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
select,input[type=search]{font:500 11px "Be Vietnam Pro",system-ui,sans-serif;border:1px solid var(--line);border-radius:5px;padding:3px 6px;background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-self:end;margin-left:auto}
.chip{font:500 10px "Be Vietnam Pro",system-ui,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:2px 8px;cursor:pointer}
.chip.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);font-weight:600}

.tbl-wrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:8px;background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:11px}
th,td{padding:3px 7px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;z-index:2;background:var(--surface);font:600 9px/1.2 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.01em;color:var(--muted);cursor:pointer}
th:hover{color:var(--teal)}
th.g{top:0;text-align:center;text-transform:uppercase;letter-spacing:.05em;font-size:9px;border-left:1px solid var(--line)}
th.gA{background:var(--teal);color:var(--surface)}
th.c{top:17px}
th.sticky,td.sticky{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;min-width:150px;max-width:220px;font-weight:600;border-right:1px solid var(--line)}
tr:hover td{background:var(--teal-soft)}
tr.total td{font-weight:700;background:var(--teal-soft);border-top:2px solid var(--teal)}
.cell-bad{color:var(--red);font-weight:600}.cell-warn{color:var(--orange);font-weight:600}.cell-good{color:var(--green);font-weight:600}
.bar{display:inline-block;height:4px;border-radius:2px;vertical-align:middle;margin-right:2px}
.bar-red{background:var(--red)}.bar-orange{background:var(--orange)}.bar-green{background:var(--green)}
.foot{color:var(--muted);font-size:10px;padding-top:4px}

@media(max-width:760px){
  .wrap{padding:4px 6px 16px;gap:4px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi .v{font-size:14px}
  .chips{margin-left:0;flex-basis:100%}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">W</div>
      <div>
        <h1>BÁO CÁO HỦY & MCH Win Rural</h1>
        <div class="fileinfo" id="fileinfo">by HaoDT v1.0 · Tải file Excel RECAP để bắt đầu</div>
      </div>
      <span class="tag">HỦY</span><span class="tag sub">MCH</span>
    </div>
    <div>
      <button class="btn" onclick="document.getElementById('file').click()">📂 Mở Excel</button>
      <button class="btn" onclick="fetchLiveData()">📡 Data mới</button>
      <button class="btn primary" onclick="exportExcel()">📥 Export</button>
    </div>
  </div>

  <div class="drop" id="drop" onclick="document.getElementById('file').click()">
    <h2>📊 Kéo thả file RECAP vào đây</h2>
    <p>File .xlsb / .xlsx · BÁO CÁO HỦY & MCH CHUỖI WINRURAL</p>
  </div>
  <input type="file" id="file" accept=".xlsb,.xlsx,.xls" hidden onchange="loadFile(this.files[0])">

  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs"></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:end;justify-content:space-between">
      <div class="filters">
        <div class="f"><label>Tìm</label><input type="search" id="q" placeholder="Tên..." oninput="render()" style="width:110px"></div>
        <div class="f"><label>Sắp xếp</label><select id="fSort" onchange="render()" style="width:100px">
          <option value="slc-desc">S&L&C ↓</option><option value="huy-desc">%Hủy ↓</option>
          <option value="rev-desc">Rev ↓</option><option value="dio-desc">DIO ↓</option>
          <option value="key-asc">A→Z</option>
        </select></div>
        <button class="btn" onclick="resetFilters()" style="font-size:10px">🔄</button>
      </div>
      <div class="chips" id="chipCols"></div>
    </div>
    <div class="tbl-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
// FULL column definitions from RECAP
const LEFT_COLS = [
  {k:'rev_ly',l:'Rev. LY',g:'Sale'},
  {k:'gap_sale_ly',l:'GAP Sale LY',g:'Sale'},
  {k:'tt_ly',l:'TT vs LY',g:'Sale',fmt:'pct'},
  {k:'rev_mtd',l:'Rev. MTD',g:'Sale'},
  {k:'rev_lmtd',l:'Rev. LMTD',g:'Sale'},
  {k:'gap_sale_lm',l:'GAP Sale LM',g:'Sale'},
  {k:'tt_lm',l:'TT vs LM',g:'Sale',fmt:'pct'},
  {k:'huy_cm',l:'%Hủy CM',g:'Hủy',fmt:'pct'},
  {k:'huy_lm',l:'%Hủy LM',g:'Hủy',fmt:'pct'},
  {k:'gap_sl_lm',l:'GAP S&L LM',g:'Hủy'},
  {k:'cp_cm',l:'%CP CM',g:'CP',fmt:'pct'},
  {k:'cp_lm',l:'%CP LM',g:'CP',fmt:'pct'},
  {k:'gap_cp_lm',l:'GAP CP LM',g:'CP'},
  {k:'rev_wtd',l:'Rev. WTD',g:'Week'},
  {k:'rev_lwtd',l:'Rev. LWTD',g:'Week'},
  {k:'tt_lw',l:'TT vs LW',g:'Week',fmt:'pct'},
  {k:'huy_cw',l:'%Hủy CW',g:'Hủy W',fmt:'pct'},
  {k:'huy_lw',l:'%Hủy LW',g:'Hủy W',fmt:'pct'},
  {k:'gap_sl_lw',l:'GAP S&L LW',g:'Hủy W'},
  {k:'rev_l7d',l:'Rev. L7D',g:'Day'},
  {k:'rev_cd',l:'Rev. CD',g:'Day'},
  {k:'tt_sdlw',l:'TT vs SDLW',g:'Day',fmt:'pct'},
  {k:'stock_qty',l:'Stock Qty',g:'Stock'},
  {k:'stock_val',l:'Stock Value',g:'Stock'},
  {k:'dio',l:'DIO',g:'Stock',fmt:'dio'},
];

const MCH3_COLS = [
  {k:'rev_ly',l:'Rev. LY',g:'Sale'},
  {k:'gap_sale_ly',l:'GAP Sale LY',g:'Sale'},
  {k:'tt_ly',l:'TT vs LY',g:'Sale',fmt:'pct'},
  {k:'rev_mtd',l:'Rev. MTD',g:'Sale'},
  {k:'rev_lmtd',l:'Rev. LMTD',g:'Sale'},
  {k:'gap_sale_lm',l:'GAP Sale LM',g:'Sale'},
  {k:'tt_lm',l:'TT vs LM',g:'Sale',fmt:'pct'},
  {k:'slc_cm',l:'%S&L&C CM',g:'S&L&C',fmt:'pct'},
  {k:'slc_lm',l:'%S&L&C LM',g:'S&L&C',fmt:'pct'},
  {k:'slc_val_lm',l:'S&L&C LM',g:'S&L&C'},
  {k:'slc_val_cm',l:'S&L&C CM',g:'S&L&C'},
  {k:'gap_slc_lm',l:'GAP S&L&C LM',g:'S&L&C'},
  {k:'huy_cm',l:'%Hủy CM',g:'Hủy',fmt:'pct'},
  {k:'huy_lm',l:'%Hủy LM',g:'Hủy',fmt:'pct'},
  {k:'gap_sl_lm',l:'GAP S&L LM',g:'Hủy'},
  {k:'cp_cm',l:'%CP CM',g:'CP',fmt:'pct'},
  {k:'cp_lm',l:'%CP LM',g:'CP',fmt:'pct'},
  {k:'gap_cp_lm',l:'GAP CP LM',g:'CP'},
  {k:'rev_wtd',l:'Rev. WTD',g:'Week'},
  {k:'rev_lwtd',l:'Rev. LWTD',g:'Week'},
  {k:'tt_lw',l:'TT vs LW',g:'Week',fmt:'pct'},
  {k:'huy_cw',l:'%Hủy CW',g:'Hủy W',fmt:'pct'},
  {k:'huy_lw',l:'%Hủy LW',g:'Hủy W',fmt:'pct'},
  {k:'gap_sl_lw',l:'GAP S&L LW',g:'Hủy W'},
  {k:'rev_l7d',l:'Rev. L7D',g:'Day'},
  {k:'rev_cd',l:'Rev. CD',g:'Day'},
  {k:'tt_sdlw',l:'TT vs SDLW',g:'Day',fmt:'pct'},
  {k:'stock_qty',l:'Stock Qty',g:'Stock'},
  {k:'stock_val',l:'Stock Value',g:'Stock'},
  {k:'dio',l:'DIO',g:'Stock',fmt:'dio'},
];

let DATA={gdv:[],mch3:[],mien:[],storeType:[]}, METADATA={unit:'Tr.đ'}, TAB='gdv', VIS={};
LEFT_COLS.forEach(c=>{VIS[c.g]=true;});

function loadData(jsonData){
  DATA = jsonData; METADATA = jsonData.meta||{unit:'Tr.đ'};
  document.getElementById('drop').hidden = true;
  document.getElementById('app').hidden = false;
  const tabs = [['gdv','📋 GĐV'],['mch3','🏷 Top MCH3'],['mien','🗺 Miền'],['storeType','🏪 Store Type']];
  document.getElementById('tabs').innerHTML = tabs.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'active':''}">${l}</button>`).join('');
  document.getElementById('tabs').onclick = e => {const b=e.target.closest('button');if(!b)return;TAB=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render();};

  // Column group chips
  const cols = TAB==='mch3' ? MCH3_COLS : LEFT_COLS;
  const groups = [...new Set(cols.map(c=>c.g))];
  if(!Object.keys(VIS).length) groups.forEach(g=>VIS[g]=true);
  document.getElementById('chipCols').innerHTML = groups.map(g=>`<button class="chip ${VIS[g]?'on':''}" data-g="${g}">${g}</button>`).join('');
  document.getElementById('chipCols').onclick = e => {const b=e.target.closest('.chip');if(!b)return;const g=b.dataset.g;VIS[g]=!VIS[g];b.classList.toggle('on',VIS[g]);render();};
  render();
}

function render(){
  const rows = DATA[TAB]||[];
  const cols = TAB==='mch3' ? MCH3_COLS : LEFT_COLS;
  const q = (document.getElementById('q').value||'').toLowerCase();
  const sort = document.getElementById('fSort').value;
  let filtered = q ? rows.filter(r=>(r.name||'').toLowerCase().includes(q)) : [...rows];
  switch(sort){
    case 'slc-desc': filtered.sort((a,b)=>(b.slc_cm||b.huy_cm||0)-(a.slc_cm||a.huy_cm||0)); break;
    case 'huy-desc': filtered.sort((a,b)=>(b.huy_cm||0)-(a.huy_cm||0)); break;
    case 'rev-desc': filtered.sort((a,b)=>(b.rev_mtd||0)-(a.rev_mtd||0)); break;
    case 'dio-desc': filtered.sort((a,b)=>(b.dio||0)-(a.dio||0)); break;
    default: filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  }

  // KPI
  const totRev = filtered.reduce((s,r)=>s+(r.rev_mtd||0),0);
  const avgHuy = filtered.length ? filtered.reduce((s,r)=>s+(r.huy_cm||0),0)/filtered.length : 0;
  const avgDIO = filtered.length ? filtered.reduce((s,r)=>s+(r.dio||0),0)/filtered.length : 0;
  document.getElementById('kpis').innerHTML = [
    ['Rev MTD',fmt(totRev,'b'),filtered.length+' dòng'],
    ['%Hủy CM TB',(avgHuy*100).toFixed(2)+'%',Math.abs(avgHuy)>0.04?'⚠️':'✅'],
    ['DIO TB',Math.round(avgDIO)+' ngày',avgDIO>40?'⚠️':'✅'],
    ['ĐVT',METADATA.unit,''],
  ].map(([l,v,s])=>`<div class="kpi"><div class="lbl">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');

  // Build grouped headers
  const activeCols = cols.filter(c=>VIS[c.g]);
  const groups = [...new Set(activeCols.map(c=>c.g))];
  let gRow = '<tr><th class="sticky g" rowspan="2">Tên</th>';
  let cRow = '';
  let colIdx = 0;
  groups.forEach(g => {
    const gcols = activeCols.filter(c=>c.g===g);
    if(gcols.length>1) gRow += `<th class="g gA" colspan="${gcols.length}">${g}</th>`;
    else gRow += `<th class="g gA" rowspan="2">${g}</th>`;
    gcols.forEach(c => { cRow += `<th class="c" data-k="${c.k}">${c.l}</th>`; colIdx++; });
  });
  gRow += '</tr>';
  document.getElementById('tbl').querySelector('thead').innerHTML = gRow + '<tr>'+cRow+'</tr>';

  // Build body
  document.getElementById('tbl').querySelector('tbody').innerHTML = filtered.map(r => {
    let html = `<td class="sticky">${r.name||''}</td>`;
    activeCols.forEach(c => {
      const v = r[c.k];
      if(v==null||isNaN(v)){ html+='<td>—</td>'; return; }
      if(c.fmt==='pct'){
        const pct=v*100, cls=Math.abs(pct)>4?'cell-bad':Math.abs(pct)>2?'cell-warn':'cell-good';
        html+=`<td class="${cls}">${pct.toFixed(2)}%</td>`;
      }else if(c.fmt==='dio'){
        html+=`<td class="${v>40?'cell-bad':v>30?'cell-warn':'cell-good'}">${Math.round(v)}</td>`;
      }else if(c.k.includes('rev')||c.k.includes('stock')||c.k.includes('slc_val')){
        html+=`<td>${fmt(v,'b')}</td>`;
      }else if(c.k.includes('gap')){
        html+=`<td class="${v>0?'cell-bad':'cell-good'}">${fmt(v,'b')}</td>`;
      }else{
        html+=`<td>${v.toFixed(2)}</td>`;
      }
    });
    return '<tr>'+html+'</tr>';
  }).join('');

  document.getElementById('foot').textContent = `${filtered.length} dòng · ${activeCols.length} cột · ĐVT: ${METADATA.unit}`;

  // Sort click
  document.getElementById('tbl').querySelector('thead').onclick = e => {
    const th = e.target.closest('th[data-k]'); if(!th) return;
    const k = th.dataset.k;
    document.getElementById('fSort').value = k+'-desc'; render();
  };
}

function fmt(n,unit){if(!n&&n!==0)return'—';const abs=Math.abs(n);if(unit==='b'){if(abs>=1e9)return(n/1e9).toFixed(2)+' tỷ';if(abs>=1e6)return(n/1e6).toFixed(1)+' tr';return n.toFixed(2);}return n.toLocaleString('vi-VN');}
function resetFilters(){document.getElementById('q').value='';document.getElementById('fSort').value='slc-desc';render();}

function loadFile(f){
  if(!f)return;
  document.getElementById('fileinfo').textContent='Đang đọc '+f.name+'...';
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      parseRecapSheet(ws,wb.SheetNames[0]);
    }catch(err){alert('Không đọc được file: '+err.message);}
  };
  reader.readAsArrayBuffer(f);
}

function parseRecapSheet(ws,sn){
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
  const sections={},active={};
  
  // Find section markers and their headers
  for(let i=0;i<aoa.length;i++){
    const row=aoa[i];
    const c0=String(row[0]||'').trim();
    const c27=String(row[27]||'').trim();
    
    if(c0.startsWith('**') && c0!=='** ĐVT: Tr.đ'){
      const snL=c0.replace(/\*\*\s*/,'').trim();
      if(snL && !sections[snL]) sections[snL]=[];
      // This row IS the header row (cols 1-26 are column names)
      active.leftHeader=row.slice(1,27);
    }
    if(c27.startsWith('**') && c27!=='** ĐVT: Tr.đ'){
      const snR=c27.replace(/\*\*\s*/,'').trim();
      if(snR && !sections[snR]) sections[snR]=[];
      active.rightHeader=row.slice(28,58);
    }
    
    // Data rows
    if(c0 && !c0.startsWith('**') && c0!=='Grand Total' && active.leftHeader){
      const obj={name:c0};
      for(let j=1;j<27;j++) obj[`v${j}`]=row[j]!=null?Number(row[j]):null;
      // Attach to most recent left section
      const lastLeft=Object.keys(sections).filter(k=>['Miền','GĐV','Store Type'].includes(k)).pop();
      if(lastLeft) sections[lastLeft].push(obj);
    }
    if(c27 && !c27.startsWith('**') && c27!=='Grand Total' && active.rightHeader){
      const obj={name:c27};
      for(let j=28;j<58;j++) obj[`r${j-27}`]=row[j]!=null?Number(row[j]):null;
      sections[active.rightSection||'Top 20 GAP S&L&C LM']=sections[active.rightSection||'Top 20 GAP S&L&C LM']||[];
      // Track which right section we're in
      if(!sections[active.rightSection||'Top 20 GAP S&L&C LM']) sections[active.rightSection||'Top 20 GAP S&L&C LM']=[];
      sections[active.rightSection||'Top 20 GAP S&L&C LM'].push(obj);
    }
    // Track right section
    if(c27.startsWith('**') && c27!=='** ĐVT: Tr.đ') active.rightSection=c27.replace(/\*\*\s*/,'').trim();
  }

  // Map to standard fields
  DATA.gdv=(sections['GĐV']||[]).map(r=>({
    name:r.name, rev_ly:r.v1,gap_sale_ly:r.v2,tt_ly:r.v3, rev_mtd:r.v4,rev_lmtd:r.v5,gap_sale_lm:r.v6,tt_lm:r.v7,
    huy_cm:r.v8,huy_lm:r.v9,gap_sl_lm:r.v10, cp_cm:r.v11,cp_lm:r.v12,gap_cp_lm:r.v13,
    rev_wtd:r.v14,rev_lwtd:r.v15,tt_lw:r.v16, huy_cw:r.v17,huy_lw:r.v18,gap_sl_lw:r.v19,
    rev_l7d:r.v20,rev_cd:r.v21,tt_sdlw:r.v22, stock_qty:r.v23,stock_val:r.v24,dio:r.v25
  }));

  const mapMCH3 = r => ({
    name:r.name, rev_ly:r.r2||r.r1,gap_sale_ly:r.r3||r.r2,tt_ly:r.r4||r.r3, rev_mtd:r.r5||r.r4,rev_lmtd:r.r6||r.r5,gap_sale_lm:r.r7||r.r6,tt_lm:r.r8||r.r7,
    slc_cm:r.r9||r.r8,slc_lm:r.r10||r.r9,slc_val_lm:r.r11||r.r10,slc_val_cm:r.r12||r.r11,gap_slc_lm:r.r13||r.r12,

}
