<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MCH3 S&L&C Win Rural</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f5f4; --surface:#ffffff; --line:#d9dfdd; --ink:#17221f; --muted:#5d6b67;
  --red:#b91c1c; --orange:#b45309; --green:#15803d; --teal:#0f5f57;
  --red-soft:#fbe6e6; --orange-soft:#fbf0dd; --green-soft:#e5f4ea; --teal-soft:#e2f0ee;
  --accent:#c2410c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Be Vietnam Pro",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1600px;margin:0 auto;padding:10px 14px 28px;display:grid;gap:8px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:#d71920;color:#fff;font:800 17px/1 "Be Vietnam Pro",system-ui,sans-serif}
.brand h1{margin:0;font:700 17px/1.1 "Be Vietnam Pro",system-ui,sans-serif}
.tag{background:#d71920;color:#fff;font:600 9px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:3px}
.tag.sub{background:var(--teal);margin-left:4px}
.fileinfo{color:var(--muted);font-size:11px}
.btn{font:600 12px "Be Vietnam Pro",system-ui,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.drop{border:2px dashed var(--line);border-radius:10px;background:var(--surface);padding:20px;text-align:center;display:grid;gap:6px;justify-items:center;cursor:pointer}
.drop:hover{border-color:var(--teal);background:var(--teal-soft)}
.drop h2{margin:0;font:700 15px "Be Vietnam Pro",system-ui,sans-serif}
.drop p{margin:0;color:var(--muted);font-size:12px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:8px 12px;display:grid;gap:1px}
.kpi .lbl{font:600 9px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 18px/1.2 "Be Vietnam Pro",system-ui,sans-serif}
.kpi .s{font-size:10.5px;color:var(--muted)}
.up{color:var(--green)} .down{color:var(--red)} .warn{color:var(--orange)}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{font:600 12px "Be Vietnam Pro",system-ui,sans-serif;border:0;background:none;color:var(--muted);padding:6px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}

/* Filters */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:end}
.f{display:grid;gap:1px}
.f label{font:600 9px/1 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
select,input[type=search]{font:500 12px "Be Vietnam Pro",system-ui,sans-serif;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--surface);color:var(--ink)}
input[type=search]{width:130px}

/* Table */
.tbl-wrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{background:var(--surface);position:sticky;top:0;z-index:2;font:600 10px/1.2 "IBM Plex Sans Condensed",sans-serif;letter-spacing:.015em;color:var(--muted);cursor:pointer}
th:hover{color:var(--teal)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;min-width:160px;font-weight:600}
tr:hover td{background:var(--teal-soft)}
tr.total td{font-weight:700;background:var(--teal-soft);border-top:2px solid var(--teal)}
.cell-bad{color:var(--red);font-weight:600} .cell-warn{color:var(--orange);font-weight:600} .cell-good{color:var(--green);font-weight:600}
.bar{display:inline-block;height:5px;border-radius:2px;vertical-align:middle;margin-right:3px}
.bar-red{background:var(--red)} .bar-orange{background:var(--orange)} .bar-green{background:var(--green)}
.foot{color:var(--muted);font-size:10.5px;padding-top:6px;margin-top:4px}

@media(max-width:760px){
  .wrap{padding:6px 8px 20px;gap:6px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi .v{font-size:15px} .kpi .lbl{font-size:8px}
  th:first-child,td:first-child{min-width:120px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo">W</div>
      <div>
        <h1>MCH3 S&L&C Win Rural</h1>
        <div class="fileinfo" id="fileinfo">Tải file Excel để bắt đầu</div>
      </div>
      <span class="tag">HỦY</span><span class="tag sub">MCH</span>
    </div>
    <div>
      <button class="btn" onclick="document.getElementById('file').click()">📂 Mở Excel</button>
      <button class="btn" onclick="fetchLiveData()">📡 Data mới</button>
      <button class="btn primary" onclick="exportExcel()">📥 Export</button>
    </div>
  </div>

  <div class="drop" id="drop" onclick="document.getElementById('file').click()">
    <h2>📊 Kéo thả file BÁO CÁO HỦY & MCH vào đây</h2>
    <p>File .xlsb / .xlsx · Hỗ trợ định dạng RECAP</p>
  </div>
  <input type="file" id="file" accept=".xlsb,.xlsx,.xls,.csv" hidden onchange="loadFile(this.files[0])">

  <div id="app" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" id="tabs"></div>
    <div class="filters">
      <div class="f"><label>Tìm kiếm</label><input type="search" id="q" placeholder="Tên..." oninput="render()"></div>
      <div class="f"><label>Sắp xếp</label><select id="fSort" onchange="render()">
        <option value="slc-desc">S&L&C ↓</option><option value="slc-asc">S&L&C ↑</option>
        <option value="huy-desc">%Hủy ↓</option><option value="huy-asc">%Hủy ↑</option>
        <option value="rev-desc">Doanh thu ↓</option><option value="rev-asc">Doanh thu ↑</option>
        <option value="dio-desc">DIO ↓</option><option value="key-asc">A→Z</option>
      </select></div>
      <button class="btn" onclick="resetFilters()">🔄 Reset</button>
    </div>
    <div id="summary" style="font-size:11px;color:var(--muted)"></div>
    <div class="tbl-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
let DATA={gdv:[],mch3:[],mien:[],storeType:[]}, METADATA={unit:'Tr.đ'}, TAB='gdv';

function parseXLSB(buf){
  // Parse RECAP sheet from xlsb binary format
  // Using the structure: sections separated by ** headers
  const rows = [];
  try {
    // For xlsb, we'll use a simplified approach
    // The data needs pyxlsb server-side - here we handle pre-parsed JSON
    // For now, show demo if parse fails
    return null;
  } catch(e){ return null; }
}

function loadData(jsonData){
  DATA = jsonData;
  document.getElementById('drop').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('fileinfo').textContent = 
    (jsonData.meta?.source||'RECAP') + ' · ' + 
    (DATA.gdv.length+DATA.mch3.length+DATA.mien.length) + ' dòng';
  
  // Tabs
  const tabs = [['gdv','📋 GĐV'],['mch3','🏷 Top MCH3'],['mien','🗺 Miền'],['storeType','🏪 Store Type']];
  document.getElementById('tabs').innerHTML = tabs.map(([k,l])=>
    `<button data-t="${k}" class="${k===TAB?'active':''}">${l} (${(DATA[k]||[]).length})</button>`).join('');
  document.getElementById('tabs').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    TAB = b.dataset.t;
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
    render();
  };
  render();
}

function render(){
  const rows = DATA[TAB] || [];
  const q = (document.getElementById('q').value||'').toLowerCase();
  const sort = document.getElementById('fSort').value;
  
  let filtered = q ? rows.filter(r => (r.name||'').toLowerCase().includes(q)) : [...rows];
  
  switch(sort){
    case 'slc-desc': filtered.sort((a,b)=>(b.slc_cm||0)-(a.slc_cm||0)); break;
    case 'slc-asc': filtered.sort((a,b)=>(a.slc_cm||0)-(b.slc_cm||0)); break;
    case 'huy-desc': filtered.sort((a,b)=>(b.huy_cm||0)-(a.huy_cm||0)); break;
    case 'huy-asc': filtered.sort((a,b)=>(a.huy_cm||0)-(b.huy_cm||0)); break;
    case 'rev-desc': filtered.sort((a,b)=>(b.rev_mtd||0)-(a.rev_mtd||0)); break;
    case 'rev-asc': filtered.sort((a,b)=>(a.rev_mtd||0)-(b.rev_mtd||0)); break;
    case 'dio-desc': filtered.sort((a,b)=>(b.dio||0)-(a.dio||0)); break;
    default: filtered.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  }

  // KPI - compute from filtered rows
  const totRev = filtered.reduce((s,r)=>s+(r.rev_mtd||0),0);
  const avgHuy = filtered.length ? filtered.reduce((s,r)=>s+(r.huy_cm||0),0)/filtered.length : 0;
  const avgDIO = filtered.length ? filtered.reduce((s,r)=>s+(r.dio||0),0)/filtered.length : 0;
  const worstHuy = filtered.length ? Math.max(...filtered.map(r=>r.huy_cm||0)) : 0;
  const bestHuy = filtered.length ? Math.min(...filtered.map(r=>r.huy_cm||0)) : 0;

  document.getElementById('kpis').innerHTML = [
    ['Doanh thu MTD', fmt(totRev,'b'), filtered.length+' '+TAB],
    ['%Hủy TB', (avgHuy*100).toFixed(2)+'%', Math.abs(avgHuy)>0.04?'⚠️ Cao':'✅ Ổn'],
    ['DIO TB', Math.round(avgDIO)+' ngày', avgDIO>40?'⚠️':'✅'],
    ['%Hủy Cao nhất', (worstHuy*100).toFixed(2)+'%', ''],
    ['%Hủy Thấp nhất', (bestHuy*100).toFixed(2)+'%', ''],
  ].map(([l,v,s]) => 
    `<div class="kpi"><div class="lbl">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`
  ).join('');

  // Table columns based on tab
  const cols = TAB==='mch3' 
    ? [['name','MCH3'],['rev_mtd','Rev MTD'],['slc_cm','S&L&C CM%'],['slc_lm','S&L&C LM%'],['huy_cm','%Hủy CM'],['huy_lm','%Hủy LM'],['cp_cm','%CP CM'],['cp_lm','%CP LM'],['stock_val','Tồn kho'],['dio','DIO']]
    : [['name','Tên'],['rev_mtd','Rev MTD'],['rev_ly','Rev LY'],['tt_ly','TT vs LY%'],['huy_cm','%Hủy CM'],['huy_lm','%Hủy LM'],['gap_sl_lm','GAP S&L LM'],['cp_cm','%CP CM'],['cp_lm','%CP LM'],['gap_cp_lm','GAP CP LM'],['stock_val','Tồn kho'],['dio','DIO']];

  document.getElementById('tbl').querySelector('thead').innerHTML = 
    '<tr>'+cols.map(([k,l])=>`<th>${l}</th>`).join('')+'</tr>';

  document.getElementById('tbl').querySelector('tbody').innerHTML = 
    filtered.map(r => '<tr>'+cols.map(([k,l]) => {
      const v = r[k];
      if(k==='name') return `<td>${v||''}</td>`;
      if(typeof v !== 'number' || isNaN(v)) return `<td>—</td>`;
      if(k.includes('huy')||k.includes('slc')||k.includes('cp')){
        const pct = v*100;
        const cls = k.includes('gap') ? (v>0?'cell-bad':'cell-good') : 
                    (Math.abs(pct)>4?'cell-bad':Math.abs(pct)>2?'cell-warn':'cell-good');
        const barW = Math.min(Math.abs(pct)*5, 60);
        return `<td class="${cls}"><span class="bar ${Math.abs(pct)>4?'bar-red':Math.abs(pct)>2?'bar-orange':'bar-green'}" style="width:${barW}px"></span>${pct.toFixed(2)}%</td>`;
      }
      if(k==='tt_ly'){ const pct=v*100; return `<td class="${v>0?'cell-good':'cell-bad'}">${pct.toFixed(1)}%</td>`; }
      if(k==='dio') return `<td class="${v>40?'cell-bad':v>30?'cell-warn':'cell-good'}">${Math.round(v)}</td>`;
      if(k.includes('rev')) return `<td>${fmt(v,'b')}</td>`;
      if(k.includes('stock')) return `<td>${fmt(v,'b')}</td>`;
      return `<td>${v.toFixed(2)}</td>`;
    }).join('')+'</tr>').join('');

  document.getElementById('foot').innerHTML = 
    `<b>${filtered.length}</b> dòng · ĐVT: ${METADATA.unit} · <b>${new Date().toLocaleDateString('vi-VN')}</b>`;
}

function fmt(n, unit){ 
  if(!n && n!==0) return '—';
  if(unit==='b'){ const abs=Math.abs(n); if(abs>=1e9) return (n/1e9).toFixed(2)+' tỷ'; if(abs>=1e6) return (n/1e6).toFixed(1)+' tr'; return n.toFixed(1); }
  return n.toLocaleString('vi-VN');
}

function resetFilters(){ document.getElementById('q').value=''; document.getElementById('fSort').value='slc-desc'; render(); }

function loadFile(f){
  if(!f) return;
  document.getElementById('fileinfo').textContent = 'Đang đọc ' + f.name + '...';
  const reader = new FileReader();
  reader.onload = e => {
    const buf = new Uint8Array(e.target.result);
    // Try xlsx first, then CSV
    try {
      const wb = XLSX.read(buf, {type:'array'});
      const sn = wb.SheetNames[0];
      const ws = wb.Sheets[sn];
      parseRecapSheet(ws, sn);
    } catch(err){
      // Try CSV
      try {
        const text = new TextDecoder().decode(buf);
        alertBox('File CSV chưa được hỗ trợ. Vui lòng dùng file .xlsx hoặc .xlsb định dạng RECAP.');
      } catch(e2){ alertBox('Không đọc được file: ' + err.message); }
    }
  };
  reader.readAsArrayBuffer(f);
}

function parseRecapSheet(ws, sn){
  const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  if(!aoa.length) return alertBox('Sheet trống');
  
  // Detect sections by ** marker
  const sections = {};
  let currentSection = null;
  let headerRow = null;
  
  for(let i=0; i<aoa.length; i++){
    const row = aoa[i];
    const col0 = String(row[0]||'').trim();
    
    if(col0.startsWith('**')){
      currentSection = col0.replace(/\*\*\s*/,'').trim();
      sections[currentSection] = {header:[], rows:[]};
      // Read header from this or next row
      headerRow = row;
      // Next row might be the actual header
      continue;
    }
    
    if(currentSection && !sections[currentSection].header.length && col0){
      // This is the sub-header row
      sections[currentSection].header = row.map(c => String(c||'').slice(0,40));
      continue;
    }
    
    if(currentSection && col0 && col0 !== 'Grand Total'){
      const obj = {name: col0};
      for(let j=1; j<27; j++) obj[`v${j}`] = row[j]!=null ? Number(row[j]) : null;
      for(let j=27; j<Math.min(62,row.length); j++) obj[`r${j-27}`] = row[j]!=null ? Number(row[j]) : null;
      sections[currentSection].rows.push(obj);
    }
  }

  // Map to standardized fields
  DATA = {gdv:[], mch3:[], mien:[], storeType:[], meta:{source:sn}};
  
  // GĐV section: left columns 0-26
  if(sections['GĐV']) DATA.gdv = sections['GĐV'].rows.map(r => ({
    name: r.name,
    rev_ly: r.v1, gap_sale_ly: r.v2, tt_ly: r.v3,
    rev_mtd: r.v4, rev_lmtd: r.v5, gap_sale_lm: r.v6, tt_lm: r.v7,
    huy_cm: r.v8, huy_lm: r.v9, gap_sl_lm: r.v10,
    cp_cm: r.v11, cp_lm: r.v12, gap_cp_lm: r.v13,
    rev_wtd: r.v14, rev_lwtd: r.v15, tt_lw: r.v16,
    huy_cw: r.v17, huy_lw: r.v18, gap_sl_lw: r.v19,
    rev_l7d: r.v20, rev_cd: r.v21, tt_sdlw: r.v22,
    stock_qty: r.v23, stock_val: r.v24, dio: r.v25
  }));

  // MCH3 Top 20: right columns 27+
  if(sections['Top 20 GAP S&L&C LM']) DATA.mch3 = sections['Top 20 GAP S&L&C LM'].rows.map(r => ({
    name: r.name,
    rev_ly: r.r1, gap_sale_ly: r.r2, tt_ly: r.r3,
    rev_mtd: r.r4, rev_lmtd: r.r5, gap_sale_lm: r.r6, tt_lm: r.r7,
    slc_cm: r.r8, slc_lm: r.r9, slc_val_lm: r.r10, slc_val_cm: r.r11,
    gap_slc_lm: r.r12,
    huy_cm: r.r13, huy_lm: r.r14, gap_sl_lm: r.r15,
    cp_cm: r.r16, cp_lm: r.r17, gap_cp_lm: r.r18,
    rev_wtd: r.r19, rev_lwtd: r.r20, tt_lw: r.r21,
    huy_cw: r.r22, huy_lw: r.r23, gap_sl_lw: r.r24,
    rev_l7d: r.r25, rev_cd: r.r26, tt_sdlw: r.r27,
    stock_qty: r.r28, stock_val: r.r29, dio: r.r30
  }));

  // Miền section
  if(sections['Miền']) DATA.mien = sections['Miền'].rows.map(r => ({
    name: r.name,
    rev_ly: r.v1, gap_sale_ly: r.v2, tt_ly: r.v3,
    rev_mtd: r.v4, rev_lmtd: r.v5, gap_sale_lm: r.v6, tt_lm: r.v7,
    huy_cm: r.v8, huy_lm: r.v9, gap_sl_lm: r.v10,
    cp_cm: r.v11, cp_lm: r.v12, gap_cp_lm: r.v13,
    rev_wtd: r.v14, rev_lwtd: r.v15, tt_lw: r.v16,
    huy_cw: r.v17, huy_lw: r.v18, gap_sl_lw: r.v19,
    rev_l7d: r.v20, rev_cd: r.v21, tt_sdlw: r.v22,
    stock_qty: r.v23, stock_val: r.v24, dio: r.v25
  }));

  // Store Type section
  if(sections['Store Type']) DATA.storeType = sections['Store Type'].rows.map(r => ({
    name: r.name,
    rev_ly: r.v1, gap_sale_ly: r.v2, tt_ly: r.v3,
    rev_mtd: r.v4, rev_lmtd: r.v5, gap_sale_lm: r.v6, tt_lm: r.v7,
    huy_cm: r.v8, huy_lm: r.v9, gap_sl_lm: r.v10,
    cp_cm: r.v11, cp_lm: r.v12, gap_cp_lm: r.v13,
    rev_wtd: r.v14, rev_lwtd: r.v15, tt_lw: r.v16,
    huy_cw: r.v17, huy_lw: r.v18, gap_sl_lw: r.v19,
    rev_l7d: r.v20, rev_cd: r.v21, tt_sdlw: r.v22,
    stock_qty: r.v23, stock_val: r.v24, dio: r.v25
  }));

  loadData(DATA);
}

function exportExcel(){
  const rows = DATA[TAB]||[];
  const ws = XLSX.utils.json_to_sheet(rows.map(r=>{
    const o={Tên:r.name};
    ['rev_mtd','huy_cm','huy_lm','slc_cm','slc_lm','cp_cm','cp_lm','dio','stock_val'].forEach(k=>{if(r[k]!=null)o[k]=(typeof r[k]==='number'&&k.includes('huy')||k.includes('slc')||k.includes('cp'))?(r[k]*100).toFixed(2)+'%':r[k];});
    return o;
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, TAB);
  XLSX.writeFile(wb, 'MCH3_SLC_'+TAB+'.xlsx');
}

function alertBox(msg){ alert(msg); }

async function fetchLiveData(){
  try {
    document.getElementById('fileinfo').textContent = 'Đang tải data mới nhất...';
    const resp = await fetch('data.json');
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const json = await resp.json();
    loadData(json);
    document.getElementById('fileinfo').textContent = '✅ Data mới nhất: ' + (json.meta?.source||'RECAP') + ' · ' + (json.gdv?.length+json.mch3?.length+json.mien?.length) + ' dòng';
  } catch(e){
    alertBox('Không tải được data mới: ' + e.message + '\nDùng file Excel thay thế.');
  }
}

['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e=>{e.preventDefault();document.getElementById('drop').style.borderColor='var(--teal)';}));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e=>{e.preventDefault();document.getElementById('drop').style.borderColor='';if(ev==='drop'){const f=e.dataTransfer?.files?.[0];if(f)loadFile(f);}}));

// Auto-load demo with sample data
